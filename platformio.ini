; PlatformIO project configuration for the SmartLedController CCT dimmer.
;
; The firmware source lives in main/ and is compiled as an ESP-IDF component
; (main/CMakeLists.txt is reused as-is).
;
; Building with PlatformIO:
;   pio run                 # build
;   pio run -t upload       # flash over USB
;   pio device monitor      # serial log

[platformio]
default_envs = smartled-c6
src_dir = main

[env:smartled-c6]
platform = espressif32
board = esp32-c6-devkitc-1
framework = espidf

; Custom partition table (NVS + Zigbee storage + 2 MB app slot, 4 MB flash).
board_build.partitions = partitions.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_unflags = -Werror

; The Zigbee SDK ships a prebuilt library; keep warnings non-fatal so a new
; IDF release cannot break the build over an unused parameter.
build_flags =
	-DCONFIG_LOG_DEFAULT_LEVEL_INFO=y